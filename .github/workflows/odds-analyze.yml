# ArbitrEdge V4 -- daily line-shopping analysis of all collected odds, plus NFL final scores for the
# Book Need Tracker from nflverse (public, no key). No Odds API calls, no secret.
name: odds-analyze
on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-odds-state
  cancel-in-progress: false
jobs:
  analyze:
    if: vars.V4_LIVE == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write           # publish the report to the v4-state release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - name: Download all odds shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shards report
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName | select(startswith("odds-data-"))'); do
            gh release download "$tag" -p 'quotes_*.jsonl.gz' -D "shards/$tag"
          done
      - name: Analyze
        run: |
          python3 -m pip install --quiet "$(grep -i '^numpy==' requirements-v4.txt)"
          python3 -m analysis_v4.actions_analyze --shards shards --out report
      - name: Publish report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v4-state >/dev/null 2>&1 || gh release create v4-state --prerelease --title "V4 state (do not delete)" --notes "Managed by workflows."
          gh release upload v4-state report/line_shop_latest.json report/line_shop_summary.md --clobber
      - name: NFL final scores (nflverse; saved only when they changed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results_old results_new
          gh release download v4-results -p 'results_nfl_*.json.gz' -D results_old 2>/dev/null || true
          python3 -m data_v4.results --sport nfl --existing results_old --out results_new
          shopt -s nullglob
          files=(results_new/results_*.json.gz)
          (( ${#files[@]} )) || exit 0
          gh release view v4-results >/dev/null 2>&1 || gh release create v4-results --prerelease \
            --title "V4 final scores (do not delete)" --notes "Immutable final-score files for the Book Need Tracker."
          gh release upload v4-results "${files[@]}"
