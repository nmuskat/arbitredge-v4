# TEMPORARY one-off test (owner-approved 2026-11-18): can GitHub's servers read @BettingSplits' posts and images
# through X's free embed feed? Manual only, no secrets, no API keys. Deleted after the test.
name: x-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Try X's embed feed and image server
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for i in 1 2 3; do
            code=$(curl -sS -L -A "$UA" --max-time 30 -o tl.html -w "%{http_code}" \
              "https://syndication.twitter.com/srv/timeline-profile/screen-name/BettingSplits" || echo ERR)
            echo "timeline try $i: HTTP $code, $(wc -c < tl.html 2>/dev/null) bytes"
            [ "$code" = 200 ] && break; sleep 20
          done
          python3 - <<'PY'
          import json, re
          h = open("tl.html", encoding="utf-8", errors="replace").read()
          m = re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>', h, re.S)
          if not m:
              print("no embedded data"); raise SystemExit
          d = json.loads(m.group(1))
          ents = d["props"]["pageProps"]["timeline"]["entries"]
          print("posts in feed:", len(ents))
          for e in ents:
              t = (e.get("content") or {}).get("tweet") or {}
              media = [x.get("media_url_https") for x in (t.get("extended_entities") or t.get("entities") or {}).get("media", [])]
              print("POST", t.get("id_str"), t.get("created_at"), "|", (t.get("full_text") or t.get("text") or "")[:90].replace("\n", " "), "|", " ".join(m for m in media if m))
          PY
