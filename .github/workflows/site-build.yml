# ArbitrEdge V4 -- rebuild the private site from already-collected data, then (when the owner
# has switched it on) deploy it to the owner-only Cloudflare Pages project.
# No Odds API calls. Called by odds-collect only after a run that saved a new odds shard, by
# cfb-rankings after a new poll, or started by hand. Callers pass ONLY the two Cloudflare secrets.
# Output: release v4-site (index.html, site_snapshot.json); release v4-book (synthetic-book ledger files);
# Cloudflare Pages production deployment.
# Deploy is OFF unless repository variable CF_PAGES_DEPLOY = on, and refused unless both
# <project>.pages.dev and *.<project>.pages.dev send unauthenticated visitors to Cloudflare Access.
name: site-build
on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20       # owner-approved 2026-11-12 (was 10: Build site began exceeding it on 2026-11-11)
    concurrency:
      group: v4-site
      cancel-in-progress: false
    permissions:
      contents: write           # release assets only (the built page); no code changes
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - name: Download collected data
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/site_inputs.sh
      - name: Cache pip and npm downloads (integrity-checked on install)
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809   # v4.2.4
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: site-${{ runner.os }}-${{ hashFiles('requirements-v4.txt', 'deploy/cloudflare/package-lock.json') }}
      - name: List saved market-intelligence records (only when recording is switched on)
        if: ${{ vars.MARKET_INTEL_RECORD == 'on' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v4-market-intel" --jq '.assets[].name' > mi_existing.txt 2>/dev/null \
            || : > mi_existing.txt
      - name: Build site
        env:
          # Original ArbitrEdge market intelligence (spreads + totals): OFF unless the owner sets these variables.
          MARKET_INTEL: ${{ vars.MARKET_INTEL }}
          MARKET_INTEL_RECORD: ${{ vars.MARKET_INTEL_RECORD }}
        run: |
          python3 -m pip install --quiet "$(grep -i '^numpy==' requirements-v4.txt)"
          python3 -m web_v4.live_site --shards shards --ledger state/ledger.jsonl --rankings-dir rankings --out site \
            --book-dir book --book-out book_new --need-dir need --results-dir results --need-out need_new \
            --settle-dir settle --sensitivity-cache prev/sensitivity_cache.json --line-shop-cache prev/line_shop_cache.json.gz --mi-out mi_new --mi-existing mi_existing.txt \
            --splits-dir splits --splits-out splits_new --circa-dir circa
      - name: Save market-intelligence records (new files only, never overwritten)
        if: ${{ vars.MARKET_INTEL_RECORD == 'on' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(mi_new/mi_*.json)
          (( ${#files[@]} )) || { echo "no new market-intelligence records"; exit 0; }
          gh release view v4-market-intel >/dev/null 2>&1 || gh release create v4-market-intel --prerelease \
            --title "Original ArbitrEdge market intelligence records (do not delete)" \
            --notes "Immutable pre-cutoff research records (spreads: original engine; totals: mi_totals.v1). Not bets."
          gh release upload v4-market-intel "${files[@]}"
      - name: Grade market-intelligence records (separate graded_* files; frozen records never edited)
        if: ${{ vars.MARKET_INTEL_RECORD == 'on' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          mkdir -p mi_all graded_new
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v4-market-intel" --jq '.assets[] | "\(.id) \(.name)"' > mi_assets.txt 2>/dev/null || exit 0
          awk '{print $2}' mi_assets.txt > mi_names.txt
          while read -r id name; do
            case "$name" in mi_*.json) grep -qx "graded_$name" mi_names.txt || gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/$id" > "mi_all/$name";; esac
          done < mi_assets.txt
          cp mi_new/mi_*.json mi_all/ 2>/dev/null || true
          python3 -m market_intel.grade --records mi_all --shards shards --results results --rankings rankings \
            --out graded_new --existing mi_names.txt
          files=(graded_new/graded_*.json)
          (( ${#files[@]} )) || exit 0
          gh release upload v4-market-intel "${files[@]}"
      - name: Save sealed splits plays (new files only, never overwritten)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(splits_new/plays_*.json)
          (( ${#files[@]} )) || { echo "no new play records"; exit 0; }
          gh release upload v4-splits "${files[@]}"
      - name: Save synthetic-book ledger (new files only, never overwritten)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(book_new/book_*.json.gz)
          (( ${#files[@]} )) || { echo "no new ledger intervals"; exit 0; }
          gh release view v4-book >/dev/null 2>&1 || gh release create v4-book --prerelease \
            --title "V4 synthetic-book ledger (do not delete)" --notes "Immutable MODELED wager files, one per advance of a weekly run."
          gh release upload v4-book "${files[@]}"
      - name: Save Need-tracker and settlement records (new files only, never overwritten)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for dir in need_new/*/; do
            tag=$(basename "$dir")
            [[ "$tag" =~ ^(v4-need(-decisions|-[0-9]{4}-W[0-9]{2})|v4-settlement)$ ]] || { echo "unexpected release $tag"; exit 1; }
            files=("$dir"*.json.gz)
            (( ${#files[@]} )) || continue
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease \
              --title "V4 Book Need Tracker: $tag (do not delete)" --notes "Immutable MODELED research records."
            gh release upload "$tag" "${files[@]}"
          done
      - name: CF1 CFB line-follow tracker (research records; new files only, never overwritten)
        # Owner-approved 2026-11-11. Frozen rule (cf1/tracker.py RULE_HASH 4723d320...): write-once pre-kickoff
        # research records to release v4-cf1. No API calls; never places, recommends or shows a bet.
        # A failure here never blocks the site.
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          mkdir -p cf1_new
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v4-cf1" --jq '.assets[].name' > cf1_existing.txt 2>/dev/null \
            || : > cf1_existing.txt
          python3 -m cf1.tracker record --shards shards --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out cf1_new \
            --existing cf1_existing.txt
          files=(cf1_new/cf1_*.json)
          (( ${#files[@]} )) || { echo "no new CF1 records"; exit 0; }
          gh release view v4-cf1 >/dev/null 2>&1 || gh release create v4-cf1 --prerelease \
            --title "CF1 CFB line-follow tracker (do not delete)" --notes "Immutable pre-kickoff research records (frozen rule)."
          gh release upload v4-cf1 "${files[@]}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v4-site >/dev/null 2>&1 || gh release create v4-site --prerelease \
            --title "V4 site (private)" --notes "Rebuilt automatically from collected data. Download index.html and open it."
          gh release upload v4-site site/index.html site/site_snapshot.json site/sensitivity_cache.json --clobber
          # line-shopping scan cache (performance only; every entry is re-verified when used). Not uploaded if
          # another build replaced it after this build downloaded it, so an older build never overwrites newer state.
          if ! now_stamp=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v4-site" \
            --jq '[.assets[] | select(.name == "line_shop_cache.json.gz") | .updated_at][0] // ""'); then
            echo "could not read the saved line-shop cache's time: not overwritten"
          elif [[ "$now_stamp" == "$(cat prev/line_shop_cache.stamp 2>/dev/null)" ]]; then
            gh release upload v4-site site/line_shop_cache.json.gz --clobber \
              || echo "::warning::line-shop cache not saved (next build recomputes it; numbers unaffected)"
          else
            echo "line-shop cache changed since download ($now_stamp): not overwritten"
          fi
      - name: Check owner-only protection (no secrets)
        if: vars.CF_PAGES_DEPLOY == 'on'
        env:
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: bash .github/scripts/pages_deploy.sh check
      - name: Deploy to Cloudflare Pages
        if: vars.CF_PAGES_DEPLOY == 'on'
        env:
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/pages_deploy.sh deploy
      - name: Publish deploy report (no secrets)
        if: always() && vars.CF_PAGES_DEPLOY == 'on'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ -s deploy_report.jsonl ]] || exit 0
          cat deploy_report.jsonl
          gh release upload v4-site deploy_report.jsonl --clobber
