# ArbitrEdge V4 CI: runs every V4 test suite on each code push to v4-dev / main and on pull requests.
# Documentation-only changes skip it (GitHub Free minutes: each run bills ~3 minutes).
# Real-data tests (nflverse) and the website snapshot tests SKIP when their
# data is absent, so CI needs no secrets, no API keys and no network beyond PyPI.
name: v4-ci
on:
  push:
    branches: [v4-dev, main]
    paths-ignore: ["**.md", "docs_v4/**", "circa_uploads/**"]
  pull_request:
    paths-ignore: ["**.md", "docs_v4/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v4.txt
      - run: pip install -r requirements-v4.txt
      - name: V4 test suites
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider tests_v4 tests_edge tests_market tests_sharp tests_sims tests_web tests_collect
