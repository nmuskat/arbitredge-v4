# ArbitrEdge V4 -- live multi-book odds collection (credit-gated).
#
# OFF until the owner sets repository variable V4_LIVE = on. While off, the job is
# skipped (uses no Actions minutes) and the Odds API secret is never loaded.
# Schedule is generated from collect_v4/cron_plan.py (tests check they match).
# Each run decides whether a fetch is due (collect_v4/schedule_policy.py), so a
# delayed or dropped run is absorbed by the next one.
name: odds-collect
on:
  schedule:
    - cron: "17 0,3,6,9,12,15,18,21 * * 0,1,2,3,4,5,6"
    - cron: "2,17,32,47 23 * * 4"
    - cron: "2,17,32,47 0,1 * * 5"
    - cron: "2,17,32,47 15,16,17,18,19,20,21,22,23 * * 6"
    - cron: "2,17,32,47 0,1,2,3 * * 0"
    - cron: "2,17,32,47 16,17,18,19,20,21,22,23 * * 0"
    - cron: "2,17,32,47 0,1 * * 1"
    - cron: "2,17,32,47 23 * * 1"
    - cron: "2,17,32,47 0,1 * * 2"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-odds-state          # collection, verification and analysis never overlap
  cancel-in-progress: false
jobs:
  collect:
    if: vars.V4_LIVE == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write           # release assets only (data shards + ledger/state); no code changes
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - name: Load ledger and state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/state_load.sh
      - name: Collect (credit-gated)
        env:
          V4_LIVE: ${{ vars.V4_LIVE }}
          V4_MONTHLY_CAP: ${{ vars.V4_MONTHLY_CAP }}
          V4_DAILY_CAP: ${{ vars.V4_DAILY_CAP }}
          V4_TIER: ${{ vars.V4_TIER }}
          ODDS_KEY_ENV: ODDS_API_KEY
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 -m collect_v4.actions_run --state-in state --out out
      - name: Save data shard, ledger and state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/state_save.sh
